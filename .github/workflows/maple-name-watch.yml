name: maple-name-watch
 
on:
  schedule:
    - cron: "*/5 * * * *"   # 5분마다 (GitHub 사정에 따라 지연될 수 있음)
  workflow_dispatch:         # Actions 탭에서 수동 실행용
 
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check nicknames
        env:
          API_KEY: ${{ secrets.NEXON_API_KEY }}
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NAMES: ${{ secrets.TARGET_NAMES }}   # 쉼표로 구분: 닉네임1,닉네임2
        run: |
          IFS=',' read -ra LIST <<< "$NAMES"
          i=0
          for NAME in "${LIST[@]}"; do
            i=$((i+1))
            NAME="$(echo "$NAME" | xargs)"
            [ -z "$NAME" ] && continue
 
            ENC=$(jq -rn --arg v "$NAME" '$v|@uri')
            RESP=$(curl -s -w '\n%{http_code}' \
              -H "x-nxopen-api-key: $API_KEY" \
              "https://open.api.nexon.com/maplestory/v1/id?character_name=$ENC")
            CODE=$(echo "$RESP" | tail -n1)
            BODY=$(echo "$RESP" | sed '$d')
            ERR=$(echo "$BODY" | jq -r '.error.name // empty' 2>/dev/null)
 
            if [ "$CODE" = "200" ]; then
              echo "#$i: 사용 중"
            elif [ "$CODE" = "400" ] && [ "$ERR" = "OPENAPI00004" ]; then
              echo "#$i: 조회 안 됨 -> 디스코드 알림"
              MSG="🍁 닉네임 '$NAME' 이(가) 조회되지 않습니다! 게임에서 직접 확인해보세요."
              curl -s -H "Content-Type: application/json" \
                -d "$(jq -n --arg c "$MSG" '{content:$c}')" "$WEBHOOK"
            else
              echo "#$i: 오류 HTTP $CODE $ERR"
            fi
            sleep 1
          done
